# Rope & Rung crew API — the shared-crew backend (replaces Supabase, 2026-09-14).
# A Cloudflare Pages project (rope-and-rung-api.pages.dev), the same service Hot
# Girl Summer is on: Pages needs no workers.dev subdomain on the account. The app
# itself stays on GitHub Pages; this only answers POST /rpc/<name>.
#
# Deploy:  cd worker && npx wrangler pages deploy
name = "rope-and-rung-api"
pages_build_output_dir = "./public"
compatibility_date = "2026-09-01"

[vars]
ALLOWED_ORIGINS = "https://phersm.github.io,http://localhost:8899,http://127.0.0.1:8899"

[[d1_databases]]
binding = "DB"
database_name = "rope-and-rung"
database_id = "d4b370ed-64b8-45c2-901f-0d936943bd68"
